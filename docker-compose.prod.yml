services:
  surrealdb:
    image: surrealdb/surrealdb:v2.6
    user: root
    command: start --log info --user root --pass ${SURREALDB_PASS} file:/data/slyng.db
    volumes:
      - surrealdb-prod-data:/data
    environment:
      - SURREAL_LOG=info
    healthcheck:
      test:
        ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # MinIO - S3-compatible object storage. Root creds = the app's S3 creds;
  # the API (ObjectStoreService) creates the bucket + anonymous public-read
  # policy at startup. Expose ONLY the S3 API (9000) at s3.slyng.gg — keep the
  # console (9001) private. To fall back to SeaweedFS, set S3_PROVIDER=seaweedfs.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-slyng-access-key}
      # Same fallback as slyng-api's S3_SECRET_ACCESS_KEY below — the two must
      # agree or the API can't authenticate. Without a default here, an unset
      # var left MinIO with an empty password (it refuses to boot) while the API
      # happily fell back, so nothing in the env file hinted at the mismatch.
      # Whatever value is used must be >= 8 chars; MinIO rejects shorter.
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-slyng-secret-key}
      - MINIO_API_CORS_ALLOW_ORIGIN=${S3_CORS_ORIGINS:-https://app.slyng.gg}
    volumes:
      - minio-prod-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: >
      --config /etc/livekit.yaml
      --bind 0.0.0.0
      --node-ip ${LIVEKIT_NODE_IP}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./docker/prod/livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped

  slyng-api:
    build:
      context: .
      dockerfile: docker/prod/slyng-api.dockerfile
    environment:
      - NODE_ENV=production
      - SLYNG_API_PORT=${SLYNG_API_PORT:-5175}
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_NAMESPACE=${SURREALDB_NAMESPACE:-slyng}
      - SURREALDB_DATABASE=${SURREALDB_DATABASE:-slyng}
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS}
      - S3_PROVIDER=${S3_PROVIDER:-minio}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-slyng}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-slyng-access-key}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-slyng-secret-key}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-https://s3.slyng.gg/slyng}
      - S3_CORS_ORIGINS=${S3_CORS_ORIGINS:-https://app.slyng.gg}
      - PUBLIC_URL=${PUBLIC_URL:-https://app.slyng.gg}
      - SYR_INSTANCE_URL=${SYR_INSTANCE_URL:-https://app.syr.is}
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-wss://lk.slyng.gg}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-524288000}
      - PROXY_MAX_BYTES=${PROXY_MAX_BYTES:-104857600}
      - PROXY_TIMEOUT_MS=${PROXY_TIMEOUT_MS:-10000}
      # ── Identity secrets — required ──────────────────────────────────
      # These were absent from this block entirely, so setting them in the
      # deployment environment did nothing: the container never received
      # them. `PLATFORM_DELEGATE_SECRET` gates the local-IdP crypto, and
      # its absence surfaces only as `500 Registration failed` — every
      # other route keeps working, which is why it read as a database or
      # packaging fault for a long time.
      #
      # `:?` on purpose: an unset secret fails the deploy with the name of
      # the variable, instead of a 500 that names nothing. Generate with
      # `openssl rand -hex 32`.
      - PLATFORM_DELEGATE_SECRET=${PLATFORM_DELEGATE_SECRET:?required, min 32 chars — openssl rand -hex 32}
      - SLYNG_JWT_SECRET=${SLYNG_JWT_SECRET:?required, min 32 chars — openssl rand -hex 32}
      # Optional, and empty is handled: both readers test truthiness and
      # fall back. Unset means OAuth state and issued tokens are keyed to a
      # per-process random, so every restart invalidates them — set these in
      # prod even though nothing forces you to.
      - SLYNG_SESSION_SECRET=${SLYNG_SESSION_SECRET:-}
      - SLYNG_STATE_SECRET=${SLYNG_STATE_SECRET:-}
      # ── Instance policy ─────────────────────────────────────────────
      # The DB value wins over this; the env is the fallback (account.service).
      - SLYNG_REGISTRATION_MODE=${SLYNG_REGISTRATION_MODE:-open}
      - SLYNG_ADMIN_USERNAMES=${SLYNG_ADMIN_USERNAMES:-}
      - SLYNG_ALLOWED_ORIGINS=${SLYNG_ALLOWED_ORIGINS:-}
      # Opens the public federation reads (/api/public/**, /.well-known/syr,
      # identity document+rotations) to any origin, WITHOUT credentials. Off by
      # default, matching syr's flag of the same name. Only needed for a
      # consumer that reads these straight from a browser — server-to-server
      # federation sends no Origin and is unaffected either way.
      - CORS_REFLECT_ANY_ORIGIN_PUBLIC_API=${CORS_REFLECT_ANY_ORIGIN_PUBLIC_API:-}
      # ── Delegation lifetimes — defaults mirror the code ─────────────
      - PLATFORM_TOKEN_EXPIRES_IN=${PLATFORM_TOKEN_EXPIRES_IN:-86400}
      - PLATFORM_REGISTRATION_EXPIRES_IN=${PLATFORM_REGISTRATION_EXPIRES_IN:-600}
      - INDEPENDENT_LOGIN_CALLBACK_TTL=${INDEPENDENT_LOGIN_CALLBACK_TTL:-300}
      # Empty reads as strict — the guard is `=== 'true' || === '1'`, so an
      # unset value keeps private-IP fetches blocked rather than opening SSRF.
      - PROXY_ALLOW_PRIVATE_IPS=${PROXY_ALLOW_PRIVATE_IPS:-}
      # ── GIF provider (optional) ─────────────────────────────────────
      # KLIPY_WEB is the API key and the only one that switches the feature
      # on — `KlipyProvider.available` is `!!key`. Without it the picker
      # renders a "not configured" panel rather than failing.
      # The key is used as a URL *path segment*, so a pasted secret carrying
      # a newline or wrapping quotes 404s every request while still reading
      # as configured; the provider trims and strips quotes defensively.
      - KLIPY_WEB=${KLIPY_WEB:-}
      - KLIPY_API_BASE=${KLIPY_API_BASE:-}
      # Salts the per-user Klipy id. Defaults to a public constant, which
      # would let anyone precompute a user's id from their DID — set it.
      - KLIPY_CUSTOMER_SALT=${KLIPY_CUSTOMER_SALT:-}
      - KLIPY_MEDIA_HOSTS=${KLIPY_MEDIA_HOSTS:-}
      # ── Embeds ──────────────────────────────────────────────────────
      # Twitch requires the embedding host in `parent=`. Read as
      # `process.env.PUBLIC_HOSTNAME ?? 'localhost'`, and `??` does not fire
      # on the empty string compose would produce from `:-`, so this carries
      # a real default: empty here means every Twitch embed asks Twitch to
      # render for `parent=`, which it refuses.
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME:-app.slyng.gg}
    depends_on:
      surrealdb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  slyng:
    build:
      context: .
      dockerfile: docker/prod/slyng.dockerfile
      args:
        - PUBLIC_URL=${PUBLIC_URL:-https://app.slyng.gg}
        - SLYNG_API_URL=${SLYNG_API_URL:-https://app.slyng.gg}
    restart: unless-stopped

volumes:
  surrealdb-prod-data:
    driver: local
  minio-prod-data:
    driver: local
