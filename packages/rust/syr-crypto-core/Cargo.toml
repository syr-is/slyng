[package]
name = "syr-crypto-core"
version = "0.1.0"
edition = "2021"
description = "Ed25519 key generation, multibase encoding, signing, and JCS canonicalization for Syr identity"
license = "MIT"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
chrono = "0.4"

[dev-dependencies]
hex = "0.4"
