[workspace]
resolver = "2"
members = [
    "slyng-types",
    "slyng-client",
    # Vendored from syr (packages/rust/*) — keep names/content in sync with upstream
    "syr-crypto-core",
    "syr-crypto-aegis",
    "syr-crypto-sigil",
    "syr-did",
    # slyng's build of syr's syr-crypto-wasm exports
    "slyng-idp-crypto",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["syr.is"]
rust-version = "1.77.2"
repository = "https://github.com/syr-is/slyng"
homepage = "https://syr.is"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
