<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// If the deployed web app gets loaded inside a Tauri WebView (most
			// commonly because an OAuth callback's `Location: <native-scheme>`
			// was blocked and we landed on the API host instead), bounce back
			// to the bundled native origin synchronously — before any
			// SvelteKit chunk has a chance to load. No-op on regular browsers.
			//
			// Tauri uses different schemes per platform:
			//   - macOS / iOS:                   tauri://localhost
			//   - Android / Windows / Linux:     http://tauri.localhost
			(function () {
				try {
					if (typeof window === 'undefined') return;
					var inTauri = '__TAURI_INTERNALS__' in window || '__TAURI__' in window;
					if (!inTauri) return;
					var alreadyNative =
						location.host === 'tauri.localhost' || location.protocol === 'tauri:';
					if (alreadyNative) return;
					var ua = navigator.userAgent || '';
					var isApple = /iPad|iPhone|iPod|Mac OS X/.test(ua);
					var origin = isApple ? 'tauri://localhost' : 'http://tauri.localhost';
					location.replace(origin + location.pathname + location.search + location.hash);
				} catch (_) {
					/* never block initial paint */
				}
			})();
		</script>
		<!-- Pre-hydration loading state.
		     Painted by the browser before any JS executes (and before any
		     CSS chunk has downloaded — Tailwind's prose + custom rules add
		     ~110 KB that's render-blocking). The `oklch(...)` values match
		     the dark- and light-theme `--background` / `--muted-foreground`
		     tokens in `packages/ts/ui/src/app.css`, so the placeholder
		     blends into the chrome the moment SvelteKit takes over. The
		     `#slyng-boot-fallback` element disappears as soon as
		     SvelteKit mounts the root layout (overwriting `<body>`'s
		     contents). Keep it tiny + inline; any external resource
		     defeats the point. -->
		<style>
			:root { color-scheme: light dark; }
			html, body { margin: 0; height: 100%; background: oklch(1 0 0); }
			@media (prefers-color-scheme: dark) {
				html, body { background: oklch(0.129 0.042 264.695); }
			}
			#slyng-boot-fallback {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
				font: 0.875rem/1.3 system-ui, sans-serif;
				color: oklch(0.554 0.046 257.417);
				pointer-events: none;
				text-align: center;
				padding: 1.5rem;
			}
			#slyng-boot-fallback .spin {
				width: 2rem;
				height: 2rem;
				border-radius: 9999px;
				border: 2px solid color-mix(in oklch, currentColor 25%, transparent);
				border-top-color: currentColor;
				animation: slyng-spin 0.8s linear infinite;
			}
			#slyng-boot-fallback .label { font-weight: 500; color: oklch(0.129 0.042 264.695); }
			#slyng-boot-fallback .detail { font-size: 0.75rem; opacity: 0.85; max-width: 22rem; }
			@media (prefers-color-scheme: dark) {
				#slyng-boot-fallback { color: oklch(0.704 0.04 256.788); }
				#slyng-boot-fallback .label { color: oklch(0.984 0.003 247.858); }
			}
			@keyframes slyng-spin { to { transform: rotate(360deg); } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="slyng-boot-fallback">
			<div class="spin" aria-hidden="true"></div>
			<div class="label">Starting slyng</div>
			<div class="detail">Fetching the WebAssembly client (~1.4 MB)…</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
