services:
  # SurrealDB - Multi-model database
  surrealdb:
    container_name: slyng-surrealdb
    image: surrealdb/surrealdb:v2.3.10
    command: start --log trace --user ${SURREALDB_USER:-root} --pass ${SURREALDB_PASS:-slyng-dev-password} rocksdb://data
    ports:
      - "8100:8000"
    volumes:
      - ./db/data:/data
    environment:
      - SURREAL_LOG=trace
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:8000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # MinIO - S3-compatible object storage (mirrors syr's setup). The app owns
  # bucket creation + the anonymous public-read policy at boot (ObjectStoreService),
  # so no s3_config.json is mounted. CORS is handled by MINIO_API_CORS_ALLOW_ORIGIN.
  minio:
    container_name: slyng-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "8343:9000" # S3 API (8343 so we don't clash with syr's 8333)
      - "9343:9001" # MinIO Console
    volumes:
      - ./s3/minio:/data
    environment:
      # MinIO root credentials ARE the app's S3 credentials.
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-slyng-access-key}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-slyng-secret-key}
      - MINIO_API_CORS_ALLOW_ORIGIN=${S3_CORS_ORIGINS:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # SeaweedFS - S3-compatible distributed storage (uncomment + set S3_PROVIDER=seaweedfs to use instead of MinIO)
  # seaweedfs:
  #   container_name: slyng-seaweedfs
  #   image: chrislusf/seaweedfs:latest
  #   command: >
  #     server -s3 -s3.config=/etc/seaweedfs/s3_config.json
  #     -s3.allowedOrigins=${S3_ALLOWED_ORIGINS:-*}
  #     -filer=true
  #   ports:
  #     - "8343:8333" # S3 API
  #     - "9343:9333" # Master
  #     - "8088:8080" # Volume server
  #     - "8898:8888" # Filer
  #   volumes:
  #     - ./s3/data:/data
  #     - ./s3/s3_config.json:/etc/seaweedfs/s3_config.json
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # LiveKit - WebRTC SFU for voice/video
  # --node-ip must be the host's LAN IP so ICE candidates are routable
  # from other devices. Set LIVEKIT_NODE_IP in .env for cross-device testing.
  livekit:
    container_name: slyng-livekit
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"        # HTTP/Signal
      - "7881:7881"        # RTC TCP
      - "7882:7882/udp"    # RTC UDP/ICE
      - "50000-50060:50000-50060/udp"  # ICE UDP port range
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
    restart: unless-stopped

  # Surrealist - Visual IDE for SurrealDB
  surrealist:
    container_name: slyng-surrealist
    image: surrealdb/surrealist:latest
    ports:
      - "8191:8080"
    environment:
      - SURREAL_URL=${SURREALDB_URL:-ws://surrealdb:8000/rpc}
    depends_on:
      - surrealdb
    restart: unless-stopped

  # API (NestJS + WS gateway). Part of the opt-in `app` profile — start the
  # full app stack (api + web) with:
  #   docker compose --profile app up -d
  # Connects to the other compose services by name. Secrets + PUBLIC_URL come
  # from .env (compose reads it automatically), so they match a host-run API
  # against the same SurrealDB — existing accounts/sessions stay valid.
  slyng-api:
    container_name: slyng-api
    build:
      context: .
      dockerfile: docker/dev/slyng-api.dockerfile
    ports:
      - "5175:5175"
    environment:
      - NODE_ENV=development
      - SLYNG_API_PORT=5175
      # Reach infra by compose service name (not localhost).
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_NAMESPACE=${SURREALDB_NAMESPACE:-slyng}
      - SURREALDB_DATABASE=${SURREALDB_DATABASE:-slyng}
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS:-slyng-dev-password}
      - S3_PROVIDER=${S3_PROVIDER:-minio}
      - S3_ENDPOINT=http://minio:9000
      # S3_PUBLIC_URL must be browser-reachable (presigned URLs are used by the
      # browser), so it points at the host-mapped MinIO S3 port, not the
      # internal service name.
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:8343/slyng}
      - S3_BUCKET=${S3_BUCKET:-slyng}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-slyng-access-key}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-slyng-secret-key}
      - S3_CORS_ORIGINS=${S3_CORS_ORIGINS:-*}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:5174}
      # Local identity-provider secrets — must match a host-run API to keep
      # existing accounts/delegations decryptable. Dev defaults mirror
      # .env.example; set real values in .env.
      - SLYNG_JWT_SECRET=${SLYNG_JWT_SECRET:-dev-only-slyng-jwt-secret-change-me-0000}
      - PLATFORM_DELEGATE_SECRET=${PLATFORM_DELEGATE_SECRET:-dev-only-delegate-secret-change-me-0000}
      - SLYNG_REGISTRATION_MODE=${SLYNG_REGISTRATION_MODE:-open}
      # Klipy GIF/sticker/clip/meme picker (server-only key; unset → picker unavailable)
      - KLIPY_WEB=${KLIPY_WEB:-}
      - KLIPY_API_BASE=${KLIPY_API_BASE:-}
      - KLIPY_CUSTOMER_SALT=${KLIPY_CUSTOMER_SALT:-}
      - KLIPY_MEDIA_HOSTS=${KLIPY_MEDIA_HOSTS:-}
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-524288000}
      - PROXY_MAX_BYTES=${PROXY_MAX_BYTES:-104857600}
      - PROXY_TIMEOUT_MS=${PROXY_TIMEOUT_MS:-10000}
    depends_on:
      # service_started, not service_healthy: the surrealdb image ships without
      # curl/wget, so its healthcheck reports unhealthy even when fully
      # functional. The API retries its own DB connection on boot.
      surrealdb:
        condition: service_started
      minio:
        condition: service_started
    profiles:
      - app
    restart: unless-stopped

  # Web client (SvelteKit dev server). Part of the opt-in `app` profile.
  #   docker compose --profile app up -d        # infra + api + web
  #   docker compose up -d slyng-web            # same (pulls in api + deps)
  #
  # Pure client: the Vite dev proxy forwards /api, /ws and /.well-known to
  # SLYNG_API_PROXY — the containerized API by default. To point at a
  # host-run API instead, override with
  #   SLYNG_API_PROXY=http://host.docker.internal:5175 docker compose up -d slyng-web
  slyng-web:
    container_name: slyng-web
    build:
      context: .
      dockerfile: docker/dev/slyng.dockerfile
    ports:
      - "5174:5174"
    environment:
      - SLYNG_API_PROXY=${SLYNG_API_PROXY:-http://slyng-api:5175}
    extra_hosts:
      # Lets the container reach a host-run API on Linux when SLYNG_API_PROXY
      # is overridden to host.docker.internal (already resolves on Docker
      # Desktop for macOS/Windows).
      - "host.docker.internal:host-gateway"
    depends_on:
      - slyng-api
    volumes:
      # Hot-reload the web app source. Shared packages are baked into the
      # image — rebuild (`docker compose build slyng-web`) after editing them.
      - ./apps/slyng/web/src:/app/apps/slyng/web/src:cached
      - ./apps/slyng/web/static:/app/apps/slyng/web/static:cached
    profiles:
      - app
    restart: unless-stopped
